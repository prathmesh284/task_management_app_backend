image: public.ecr.aws/lambda/python:3.11

pipelines:
  branches:
    master:   # runs after PR merge into main
      - step:
          name: Build & Deploy FastAPI Lambda (Direct Upload)
          script:
            - set -e

            # Install zip
            - yum install -y zip

            # Upgrade pip tools
            - python -m pip install --upgrade pip setuptools wheel

            # Clean old builds
            - rm -rf package lambda.zip

            # Create package directory
            - mkdir -p package

            # Install dependencies (Lambda compatible)
            - |
              pip install -r requirements.txt \
                --target ./package \
                --platform manylinux2014_x86_64 \
                --implementation cp \
                --python-version 3.11 \
                --only-binary=:all:

            # Copy application code
            - cp -r app/* package/
            - cp main.py package/

            # Create zip
            - cd package
            - zip -r ../lambda.zip .
            - cd ..

            # Install AWS CLI
            - pip install awscli

            # Direct deploy to Lambda (NO S3)
            - aws lambda update-function-code \
                --function-name ${LAMBDA_FUNCTION_NAME} \
                --zip-file fileb://lambda.zip