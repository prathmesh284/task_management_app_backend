image: public.ecr.aws/lambda/python:3.11

pipelines:
  custom:
    lambda-deployment:
      - step:
          name: Clean Build & Deploy
          script:
            - set -e
            - rm -rf ~/.cache/pip
            - yum install -y zip
            - python -m pip install --upgrade pip
            - rm -rf build
            - mkdir build
            - pip install --no-cache-dir -r requirements.txt -t build
            - cp main.py build/
            - cp -r app build/
            - cd build
            - zip -r ../lambda.zip .
            - cd ..
            - pip install awscli
            - aws s3 cp lambda.zip s3://YOUR_BUCKET/builds/lambda.zip
            - aws lambda update-function-code --function-name YOUR_FUNCTION --s3-bucket YOUR_BUCKET --s3-key builds/lambda.zip
